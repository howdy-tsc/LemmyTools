<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LemmyTools Options</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <header>
    <h1>LemmyTools Options</h1>
    <button type="button" id="save" class="primary">Save</button>
    <span id="status" aria-live="polite"></span>
  </header>

  <form id="options-form">
    <section>
      <h2>LemmyTools Settings</h2>

      <div class="row">
        <label for="instance"><strong>Home instance URL</strong>
          <small>e.g. https://lemmy.world</small></label>
        <input type="url" id="instance" placeholder="https://your.instance">
      </div>

      <div class="row">
        <label for="commposSide"><strong>LemmyTools bar position</strong>
          <small>default: top</small></label>
        <select id="commposSide">
          <option value="top">top</option>
          <option value="right">right</option>
          <option value="left">left</option>
        </select>
      </div>

      <div class="row">
        <label for="commposVertical"><strong>Bar vertical position</strong>
          <small>% from top, 0–85</small></label>
        <input type="number" id="commposVertical" min="0" max="85" step="1">
      </div>

      <div class="row">
        <label for="hoverCheck"><strong>Keep LemmyTools bar always open</strong>
          <small>best on widescreen desktops</small></label>
        <input type="checkbox" id="hoverCheck">
      </div>
    </section>

    <section>
      <h2>Site Style and Behavior</h2>

      <div class="row">
        <label for="hideSideBar"><strong>Hide Lemmy sidebars</strong>
          <small>Trending, server info, communities</small></label>
        <input type="checkbox" id="hideSideBar">
      </div>

      <div class="row">
        <label for="expandImages"><strong>Expandable images</strong>
          <small>auto-expand and click+drag to resize</small></label>
        <input type="checkbox" id="expandImages">
      </div>

      <div class="row">
        <label for="expandImagesize"><strong>Auto-expand size</strong>
          <small>desktop default 50, mobile 100</small></label>
        <span class="inline">
          <input type="number" id="expandImagesize" min="1" max="2000" step="1">
          <label class="inline-label"><input type="radio" name="widthScaler" id="widthPercent"> %</label>
          <label class="inline-label"><input type="radio" name="widthScaler" id="widthPixels"> px</label>
        </span>
      </div>

      <div class="row">
        <label for="expandImageSpeed"><strong>Expand-image speed</strong>
          <small>click+drag multiplier, 0–1, default 0.5</small></label>
        <input type="number" id="expandImageSpeed" min="0" max="1" step="0.05">
      </div>

      <div class="row">
        <label for="showAllImages"><strong>Automatically open image posts</strong></label>
        <input type="checkbox" id="showAllImages">
      </div>

      <div class="row">
        <label for="hideShowAllImagesButton"><strong>Hide “Show All Images” button</strong>
          <small>only matters when auto-open is off</small></label>
        <input type="checkbox" id="hideShowAllImagesButton">
      </div>

      <div class="row">
        <label for="unblurNSFW"><strong>Auto-unblur NSFW images</strong></label>
        <input type="checkbox" id="unblurNSFW">
      </div>

      <div class="row">
        <label for="linksInNewTab"><strong>Open ALL links in new tab</strong></label>
        <input type="checkbox" id="linksInNewTab">
      </div>
    </section>

    <section>
      <h2>Content Blocking</h2>

      <div class="row">
        <label for="blockContent"><strong>Enable content blocking</strong>
          <small>hides posts/comments matching your filters</small></label>
        <input type="checkbox" id="blockContent">
      </div>

      <div class="row column">
        <label for="blockFilters"><strong>Filters</strong>
          <small>one per line, or comma-separated</small></label>
        <textarea id="blockFilters" rows="4"
                  placeholder="filter one&#10;filter two"></textarea>
      </div>
    </section>

    <footer>
      <p>Tested on Lemmy <span id="testedVersion">0.19.1</span>.
        <a href="https://github.com/howdy-tsc/LemmyTools" target="_blank" rel="noreferrer">GitHub</a> ·
        <a href="https://github.com/howdy-tsc/LemmyTools/issues" target="_blank" rel="noreferrer">Issues</a>
      </p>
      <h3>Credits</h3>
      <ul>
        <li><strong>@cwagner@lemmy.cwagner.me</strong> — coding, code cleanup, mentoring</li>
        <li><strong>Charles Machalow (csm10495)</strong> — coding contribution(s)</li>
        <li><strong>jimmyhiggs337</strong> — coding contribution(s)</li>
      </ul>
    </footer>
  </form>

  <script src="options.js"></script>
</body>
</html>
